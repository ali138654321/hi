<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تایپ سلام</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            font-family: Tahoma, sans-serif;
        }
        #output {
            font-size: 6rem;
            color: #fff;
            text-shadow: 0 0 20px rgba(255,255,255,0.8);
            font-weight: bold;
        }
        .cursor {
            display: inline-block;
            width: 4px;
            height: 6rem;
            background: #fff;
            margin-right: 5px;
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div>
        <span id="output"></span><span class="cursor"></span>
    </div>

    <script>
        const text = "سلام";
        let i = 0;
        const output = document.getElementById("output");

        function type() {
            if (i < text.length) {
                output.textContent += text.charAt(i);
                i++;
                setTimeout(type, 300);
            }
        }

        window.onload = () => {
            setTimeout(type, 500);
        };
    </script>
</body>
</html>
