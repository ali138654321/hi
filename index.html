<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>شمارنده ساده</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f7f7f7;
            font-family: 'Courier New', monospace;
        }
        .counter {
            background: white;
            padding: 30px 60px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            font-size: 4rem;
            font-weight: bold;
            color: #2d2d2d;
            letter-spacing: 4px;
        }
    </style>
</head>
<body>
    <div class="counter" id="counter">0</div>

    <script>
        let count = 0;
        const counterEl = document.getElementById('counter');

        // هر ثانیه یک عدد اضافه می‌شود
        setInterval(() => {
            count++;
            counterEl.textContent = count;
        }, 1000);
    </script>
</body>
</html>
